spring:
  application:
    name: investments-db-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:investments}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:50}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc.batch_size: 50
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 10000
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-exception: false
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:400}
      min-spare: 20
    accept-count: 200
    max-connections: 20000

jwt:
  secret: ${JWT_SECRET:InvestmentsPlusPlusSecretKeyForSigningTokensMinimum32Characters}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

market:
  tick-ms: ${MARKET_TICK_MS:1000}
  spread-bps: ${MARKET_SPREAD_BPS:25}

rabbitmq:
  quotes-queue: ${RABBITMQ_QUOTES_QUEUE:quotes-queue}
  publish-enabled: ${RABBITMQ_PUBLISH_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    ru.rmp: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
    org.springframework.amqp: WARN
