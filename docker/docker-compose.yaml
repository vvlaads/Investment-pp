name: investment-pp

networks:
  investment-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: investment-rabbitmq
    networks:
      - investment-net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: investment-postgres
    networks:
      - investment-net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investments"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: investment-redis
    networks:
      - investment-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-service:
    build:
      context: ../4-DB-connection
      dockerfile: Dockerfile
    container_name: investment-db-service
    networks:
      - investment-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: investments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin
      RABBITMQ_QUOTES_QUEUE: quotes-queue
      RABBITMQ_INVESTMENT_EXCHANGE: investment-exchange
      RABBITMQ_INVESTMENT_QUEUE: investment-queue
      RABBITMQ_PUBLISH_ENABLED: "true"
      SERVER_PORT: 8081
      JWT_SECRET: InvestmentsPlusPlusSecretKeyForSigningTokensMinimum32Characters
      MARKET_TICK_MS: 1000
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  gateway:
    build:
      context: ../3-connection-app
      dockerfile: Dockerfile
    container_name: investment-gateway
    networks:
      - investment-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-service:
        condition: service_healthy
    environment:
      RABBITMQ_URI: amqp://admin:admin@rabbitmq:5672
      RABBITMQ_INVESTMENT_EXCHANGE: investment-exchange
      RABBITMQ_RPC_TIMEOUT_MS: 10000
      JWT_SECRET: InvestmentsPlusPlusSecretKeyForSigningTokensMinimum32Characters
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  quotes-receiver:
    build:
      context: ../
      dockerfile: docker/quotes-integration/Dockerfile
    container_name: investment-quotes-receiver
    networks:
      - investment-net
    depends_on:
      rabbitmq:
        condition: service_healthy
    privileged: true
    ports:
      - "8082:8080"
    environment:
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      RABBITMQ_QUOTES_QUEUE: quotes-queue
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  imitator:
    build:
      context: ../5-connection-imitator
      dockerfile: Dockerfile
    container_name: investment-imitator
    networks:
      - investment-net
    depends_on:
      db-service:
        condition: service_healthy
    environment:
      API_BASE_URL: http://db-service:8081
      CLIENTS: ${IMITATOR_CLIENTS:-10000}
      RAMP_UP_SECONDS: ${IMITATOR_RAMP_UP:-120}
      DURATION_SECONDS: ${IMITATOR_DURATION:-0}
      THINK_MIN_MS: 500
      THINK_MAX_MS: 3000
      HTTP_CONCURRENCY: 4096
      METRICS_INTERVAL_SECONDS: 5
      JAVA_OPTS: "-Xms512m -Xmx2g"
    profiles:
      - imitator

volumes:
  postgres_data:
